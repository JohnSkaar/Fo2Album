[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
p2a-core = { path = "crates/p2a-core" }
p2a-ingest = { path = "crates/p2a-ingest" }
p2a-store = { path = "crates/p2a-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bildebehandling i debug er svært tregt; optimaliser avhengighetene også under utvikling og test.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.p2a-ingest]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
