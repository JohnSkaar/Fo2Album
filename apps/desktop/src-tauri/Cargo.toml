[package]
name = "pho2album"
description = "Pho2Album – årets familiealbum, laget på din egen maskin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pho2album_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
p2a-core.workspace = true
p2a-ingest = { path = "../../../crates/p2a-ingest" }
p2a-store.workspace = true
p2a-keychain = { path = "../../../crates/p2a-keychain" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
