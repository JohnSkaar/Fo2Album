[package]
name = "p2a-ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"
p2a-core.workspace = true
p2a-faces = { version = "0.1.0", path = "../p2a-faces" }
p2a-heic = { version = "0.1.0", path = "../p2a-heic" }
p2a-store = { version = "0.1.0", path = "../p2a-store" }
rayon = "1"
regex = "1"
serde = { workspace = true, features = ["derive"] }
thiserror = "2"
walkdir = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
p2a-heic = { path = "../p2a-heic" }
tempfile = "3"
