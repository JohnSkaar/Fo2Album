[package]
name = "p2a-heic"
description = "HEIC-dekoding med plattformens egne API-er: ImageIO på Mac, WIC på Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Denne pakken trenger `unsafe` for å kalle operativsystemets bildebiblioteker (FFI).
# Unntaket gjelder bare her; resten av workspacet forbyr `unsafe`.
[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString", "CFBase"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGGeometry"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "CGImageDestination", "objc2-core-graphics"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }
