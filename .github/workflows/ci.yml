name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Grensesnitt (lint, typer, tester, bygg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Bygget feiler hvis grensesnittet refererer til noe på nettet (scripts/check-no-remote.mjs).
      - run: pnpm build

  deny:
    name: Lisenser og forbudte pakker (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bygg grensesnittet
        run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      # Inkluderer crates/p2a-policy: ingen nettverk i analysekoden.
      - run: cargo test --workspace --locked
      - name: Bygg appen
        working-directory: apps/desktop
        run: pnpm tauri build --debug --no-bundle
      - name: Røyktest (starter appen)
        shell: bash
        run: node scripts/smoke-test.mjs "target/debug/fo2album${{ runner.os == 'Windows' && '.exe' || '' }}"

  verktoy:
    name: Verktøyet p2a (${{ matrix.os }})
    # Bare når noen trykker «Run workflow», så vanlige pusher ikke bruker ekstra minutter.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: p2a-macos
            bin: target/release/p2a
          - os: windows-latest
            artifact: p2a-windows
            bin: target/release/p2a.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p p2a-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
