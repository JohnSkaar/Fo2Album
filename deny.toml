# cargo-deny: lisenser, forbudte pakker og kilder. Kjøres i CI.
# Se docs/ARCHITECTURE.md, «Lisenser», og CLAUDE.md («sjekk lisens før bruk»).

[graph]
# Vi leverer bare til Mac og Windows.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Tillatende lisenser som er trygge for kommersiell, lukket distribusjon.
# MPL-2.0 er svak copyleft på filnivå: greit så lenge vi ikke endrer selve filene.
# Ikke legg til GPL/LGPL/AGPL uten en vurdering i docs/ARCHITECTURE.md.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
# Lisenser i listen som ingen pakke bruker ennå, er greit.
unused-allowed-license = "allow"

# Våre egne pakker (publish = false) er proprietære og sjekkes ikke.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Nettverksklienter og TLS. Analysekoden sjekkes også av crates/p2a-policy.
# Når bestilling (M7) kommer, legges `p2a-order` inn som eneste tillatte bruker via `wrappers`.
deny = [
  { crate = "reqwest", reason = "Lokalt først: ingen HTTP-klient før bestilling (M7)" },
  { crate = "hyper", reason = "Lokalt først" },
  { crate = "ureq", reason = "Lokalt først" },
  { crate = "isahc", reason = "Lokalt først" },
  { crate = "curl", reason = "Lokalt først" },
  { crate = "surf", reason = "Lokalt først" },
  { crate = "attohttpc", reason = "Lokalt først" },
  { crate = "openssl", reason = "Lokalt først; bruk ikke systemets TLS" },
  { crate = "native-tls", reason = "Lokalt først" },
  { crate = "rustls", reason = "Lokalt først" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
